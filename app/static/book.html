<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a meeting</title>
<style>
  :root{--bg:#f4f7fb;--card:#fff;--line:#e3e9f2;--text:#16202e;--dim:#66788f;--accent:#2563eb;--good:#059669}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:400 16px/1.5 'Segoe UI',system-ui,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;
        padding:32px;box-shadow:0 10px 40px rgba(22,32,46,.08)}
  h1{font-size:1.35rem;margin-bottom:4px}
  .sub{color:var(--dim);margin-bottom:22px;font-size:.95rem}
  .slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .slot{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;cursor:pointer;
        font-size:.9rem;background:#fff;transition:.12s}
  .slot:hover{border-color:var(--accent);color:var(--accent)}
  .slot.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
  button{margin-top:20px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--accent);
         color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
  button:disabled{opacity:.45;cursor:not-allowed}
  .done{text-align:center;padding:16px 0}
  .done .big{font-size:2.4rem}
  .done h2{margin:8px 0 4px}
  .done a{color:var(--accent);word-break:break-all}
  .muted{color:var(--dim);font-size:.9rem;margin-top:8px}
</style>
</head>
<body>
<div class="card" id="card">
  <h1 id="title">Book a meeting</h1>
  <div class="sub" id="sub">Loading available times…</div>
  <div class="slots" id="slots"></div>
  <button id="confirm" disabled>Confirm meeting</button>
</div>
<script>
const token = location.pathname.split("/").pop();
let chosen = null;
async function load(){
  const r = await fetch(`/api/book/${token}`);
  if(!r.ok){ document.getElementById("card").innerHTML = "<div class='done'><div class='big'>⌛</div><h2>This link has expired</h2></div>"; return; }
  const d = await r.json();
  document.getElementById("title").textContent = `Meet with ${d.company}`;
  document.getElementById("sub").textContent = `Pick a time for ${d.prospect} — all times PKT (UTC+5)`;
  const box = document.getElementById("slots");
  d.slots.forEach(s=>{
    const el = document.createElement("div");
    el.className="slot"; el.textContent=s.label;
    el.onclick=()=>{ document.querySelectorAll(".slot").forEach(x=>x.classList.remove("sel"));
      el.classList.add("sel"); chosen=s.utc; document.getElementById("confirm").disabled=false; };
    box.appendChild(el);
  });
}
document.getElementById("confirm").onclick = async ()=>{
  const fd = new FormData(); fd.append("slot_utc", chosen);
  const r = await fetch(`/api/book/${token}`, {method:"POST", body:fd});
  const d = await r.json();
  document.getElementById("card").innerHTML =
    `<div class="done"><div class="big">✅</div><h2>Meeting confirmed</h2>
     <div>${d.time_label}</div><a href="${d.link}" target="_blank">${d.link}</a>
     <div class="muted">A confirmation email is on its way. Calendar-ready link above.</div></div>`;
};
load();
</script>
</body>
</html>
